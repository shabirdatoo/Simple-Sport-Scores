<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.5.0">
  <title>Simple Sports Scores (v1.5.0)</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #dddddd;
      --border-dark: #222222;
      --accent-green: #00aa44;
      --accent-blue: #0066cc;
      --accent-red: #cc0000;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .brand-title span { color: var(--accent-blue); }

    .proxy-input {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--border-dark);
      width: 260px;
    }

    nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-dark);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }

    .nav-btn:hover { background: var(--text); color: var(--bg); }
    .nav-btn.active { background: var(--border-dark); color: #ffffff; }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .round-nav { display: flex; align-items: center; gap: 12px; font-weight: bold; }

    .round-btn {
      background: none;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      padding: 2px 8px;
      cursor: pointer;
    }

    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 1px 5px;
      display: inline-block;
      text-transform: uppercase;
    }

    .badge-live { background-color: var(--accent-green); color: #ffffff; }
    .badge-ft { border: 1px solid var(--border-dark); color: var(--text); }
    .badge-upcoming { border: 1px dashed var(--border); color: #666666; }
    .badge-f1 { background-color: var(--accent-red); color: #ffffff; }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 4px;
      margin-top: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .match-card {
      border: 1px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-teams { font-weight: bold; }
    .match-meta { text-align: right; font-size: 13px; }
    .match-score { font-weight: bold; margin-right: 8px; }

    .data-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    .data-table th, .data-table td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; }
    .data-table th { border-bottom: 2px solid var(--border-dark); font-weight: bold; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .highlight-pos { color: var(--accent-blue); font-weight: bold; }

    footer {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 12px;
      font-size: 12px;
      color: #666666;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">SIMPLE SPORTS <span>SCORES</span></div>
      <div>
        <input type="text" id="proxyUrlInput" class="proxy-input" placeholder="Cloudflare Worker URL" onchange="saveProxyUrl(this.value)">
      </div>
    </div>
    <nav id="mainNav">
      <button class="nav-btn active" onclick="switchView('today', event)">Today</button>
      <button class="nav-btn" onclick="switchView('epl', event)">Premier League</button>
      <button class="nav-btn" onclick="switchView('f1', event)">Formula 1</button>
      <button class="nav-btn" onclick="switchView('facup', event)">FA Cup</button>
      <button class="nav-btn" onclick="switchView('carabao', event)">Carabao Cup</button>
      <button class="nav-btn" onclick="switchView('ucl', event)">Champions League</button>
    </nav>
  </header>

  <div class="controls-bar">
    <div class="round-nav">
      <button class="round-btn" onclick="changeRound(-1)">&lt; Prev</button>
      <span id="currentRoundLabel">Today's Matches</span>
      <button class="round-btn" onclick="changeRound(1)">Next &gt;</button>
    </div>
    <div style="font-size: 12px; color: #666666;">
      Status: <span id="statusIndicator" style="color: var(--accent-green); font-weight: bold;">● Active</span>
    </div>
  </div>

  <main id="appContent"></main>

  <footer>
    <div>Simple Sports Scores</div>
    <div>v1.5.0</div>
  </footer>

  <script>
    const APP_VERSION = '1.5.0';
    let currentView = 'today';
    let currentRound = 0;
    let proxyUrl = localStorage.getItem('sss_proxy_url') || '';

    if (proxyUrl) {
      document.getElementById('proxyUrlInput').value = proxyUrl;
    }

    function saveProxyUrl(url) {
      proxyUrl = url.trim().replace(/\/$/, "");
      localStorage.setItem('sss_proxy_url', proxyUrl);
      render();
    }

    // --- F1 DIRECT API (NO PROXY NEEDED) ---
    async function fetchF1Data() {
      try {
        const res = await fetch('https://api.jolpica.net/f1/current/last/results.json');
        if (!res.ok) return null;
        const data = await res.json();
        const race = data.MRData.RaceTable.Races[0];
        return {
          title: race.raceName,
          circuit: race.Circuit.circuitName,
          results: race.Results.map(r => ({
            pos: r.position,
            driver: `${r.Driver.givenName} ${r.Driver.familyName}`,
            team: r.Constructor.name,
            gap: r.Time ? r.Time.time : r.status,
            pts: r.points
          }))
        };
      } catch (e) {
        return null;
      }
    }

    // --- FOOTBALL PROXY API ---
    async function fetchFootballMatches(comp) {
      if (!proxyUrl) return null;
      try {
        const res = await fetch(`${proxyUrl}?comp=${comp}&type=matches`);
        if (!res.ok) return null;
        const data = await res.json();
        return data.matches.map(m => ({
          home: m.homeTeam.shortName || m.homeTeam.name,
          away: m.awayTeam.shortName || m.awayTeam.name,
          score: (m.status === 'FINISHED' || m.status === 'IN_PLAY') ? `${m.score.fullTime.home} - ${m.score.fullTime.away}` : 'vs',
          status: m.status === 'IN_PLAY' ? 'LIVE' : (m.status === 'FINISHED' ? 'FT' : 'UPCOMING')
        }));
      } catch (e) {
        return null;
      }
    }

    function switchView(view, evt) {
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (evt) evt.target.classList.add('active');
      render();
    }

    function changeRound(delta) {
      currentRound += delta;
      render();
    }

    async function render() {
      const container = document.getElementById('appContent');
      const label = document.getElementById('currentRoundLabel');
      const statusInd = document.getElementById('statusIndicator');

      container.innerHTML = `<div style="padding: 24px 0; font-weight: bold; color: #666666;">SYNCING...</div>`;

      if (currentView === 'f1') {
        const f1 = await fetchF1Data();
        label.textContent = "Latest Grand Prix";
        statusInd.textContent = "● Jolpica F1 API";
        
        container.innerHTML = f1 ? `
          <div class="section-title">${f1.title.toUpperCase()} (${f1.circuit.toUpperCase()})</div>
          <table class="data-table">
            <thead><tr><th>POS</th><th>DRIVER</th><th>TEAM</th><th class="text-right">TIME</th><th class="text-right">PTS</th></tr></thead>
            <tbody>
              ${f1.results.map(r => `<tr><td class="highlight-pos">${r.pos}</td><td><strong>${r.driver}</strong></td><td>${r.team}</td><td class="text-right">${r.gap}</td><td class="text-right"><strong>${r.pts}</strong></td></tr>`).join('')}
            </tbody>
          </table>
        ` : `<p style="padding: 16px 0;">No F1 data available.</p>`;
      } else {
        const compMap = { epl: 'PL', ucl: 'CL', facup: 'FAC', carabao: 'ELC' };
        const compCode = compMap[currentView] || 'PL';
        const matches = await fetchFootballMatches(compCode);

        label.textContent = currentView.toUpperCase();
        statusInd.textContent = matches ? "● Proxy Live" : (proxyUrl ? "● Proxy Error" : "● Worker URL Needed");

        container.innerHTML = `
          ${!proxyUrl ? `
            <div style="background: #fff8e1; border: 1px solid var(--border-dark); padding: 12px; margin-bottom: 16px; font-size: 12px;">
              <strong>Worker Setup Needed:</strong> Enter your Cloudflare Worker proxy URL in the header box above to enable live football data.
            </div>
          ` : ''}

          ${matches ? `
            <div class="section-title">${currentView.toUpperCase()} FIXTURES</div>
            ${matches.map(m => `
              <div class="match-card">
                <div class="match-teams">${m.home} vs ${m.away}</div>
                <div class="match-meta">
                  <span class="match-score">${m.score}</span>
                  <span class="badge ${m.status === 'LIVE' ? 'badge-live' : (m.status === 'FT' ? 'badge-ft' : 'badge-upcoming')}">${m.status}</span>
                </div>
              </div>
            `).join('')}
          ` : `<p style="padding: 16px 0;">No match data returned.</p>`}
        `;
      }
    }

    render();
  </script>
</body>
</html>
