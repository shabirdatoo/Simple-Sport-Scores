<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.4.0">
  <title>Simple Sports Scores (v1.4.0)</title>
  <style>
    /* ==========================================================================
       SIMPLE SPORTS SCORES (v1.4.0) - BLACK & WHITE MONOSPACED STYLING
       Primary Accent Colors: 
       - Green (#00aa44): Live status, winners, FT
       - Blue  (#0066cc): Links, league tags, active tabs
       - Red   (#cc0000): F1 indicators, badges, highlights
       ========================================================================== */
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #dddddd;
      --border-dark: #222222;
      --accent-green: #00aa44;
      --accent-blue: #0066cc;
      --accent-red: #cc0000;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* --- HEADER & NAVIGATION --- */
    header {
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text);
      display: inline-block;
    }

    .brand-title span {
      color: var(--accent-blue);
    }

    .api-key-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .api-key-input {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--border-dark);
      width: 240px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-dark);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }

    .nav-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .nav-btn.active {
      background: var(--border-dark);
      color: #ffffff;
    }

    /* --- SUB NAVIGATION & CONTROLS --- */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .round-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
    }

    .round-btn {
      background: none;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      padding: 2px 8px;
      cursor: pointer;
    }

    .round-btn:hover {
      border-color: var(--border-dark);
      background: #f0f0f0;
    }

    /* --- STATUS BADGES --- */
    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 2px;
      display: inline-block;
      text-transform: uppercase;
    }

    .badge-live {
      background-color: var(--accent-green);
      color: #ffffff;
    }

    .badge-ft {
      border: 1px solid var(--border-dark);
      color: var(--text);
    }

    .badge-upcoming {
      border: 1px dashed var(--border);
      color: #666666;
    }

    .badge-f1 {
      background-color: var(--accent-red);
      color: #ffffff;
    }

    /* --- MATCH / EVENT CARDS --- */
    .section-title {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 4px;
      margin-top: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-card {
      border: 1px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s;
    }

    .match-card:hover {
      border-color: var(--border-dark);
    }

    .match-teams {
      font-weight: bold;
    }

    .match-meta {
      text-align: right;
      font-size: 13px;
    }

    .match-score {
      font-weight: bold;
      margin-right: 8px;
    }

    /* --- STANDINGS TABLES --- */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    .data-table th, .data-table td {
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    .data-table th {
      border-bottom: 2px solid var(--border-dark);
      font-weight: bold;
    }

    .data-table tr:hover td {
      background-color: #f8f8f8;
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }

    .highlight-pos {
      color: var(--accent-blue);
      font-weight: bold;
    }

    /* --- FOOTER --- */
    footer {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 12px;
      font-size: 12px;
      color: #666666;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">SIMPLE SPORTS <span>SCORES</span></div>
      <div class="api-key-container">
        <input type="text" id="apiKeyInput" class="api-key-input" placeholder="Football-Data Key" onchange="saveApiKey(this.value)">
      </div>
    </div>
    <nav id="mainNav">
      <button class="nav-btn active" onclick="switchView('today', event)">Today</button>
      <button class="nav-btn" onclick="switchView('epl', event)">Premier League</button>
      <button class="nav-btn" onclick="switchView('f1', event)">Formula 1</button>
      <button class="nav-btn" onclick="switchView('facup', event)">FA Cup</button>
      <button class="nav-btn" onclick="switchView('carabao', event)">Carabao Cup</button>
      <button class="nav-btn" onclick="switchView('ucl', event)">Champions League</button>
    </nav>
  </header>

  <div class="controls-bar">
    <div class="round-nav">
      <button class="round-btn" onclick="changeRound(-1)">&lt; Prev</button>
      <span id="currentRoundLabel">Today's Matches</span>
      <button class="round-btn" onclick="changeRound(1)">Next &gt;</button>
    </div>
    <div style="font-size: 12px; color: #666666;">
      Status: <span id="statusIndicator" style="color: var(--accent-green); font-weight: bold;">● Fetching...</span>
    </div>
  </div>

  <main id="appContent">
    <!-- Dynamic Content Loaded Here -->
  </main>

  <footer>
    <div>Simple Sports Scores</div>
    <div>v1.4.0</div>
  </footer>

  <script>
    // --- VERSION & STATE MANAGEMENT ---
    const APP_VERSION = '1.4.0';
    let currentView = 'today';
    let currentRound = 0; // 0 = default/current matchday
    let apiKey = localStorage.getItem('sss_football_key') || '';

    if (apiKey) {
      document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey(key) {
      apiKey = key.trim();
      localStorage.setItem('sss_football_key', apiKey);
      render();
    }

    // --- REAL F1 API FETCHERS (NO API KEY NEEDED) ---
    async function fetchF1RaceResults(roundOffset) {
      try {
        const endpoint = roundOffset === 0 
          ? 'https://api.jolpica.net/f1/current/last/results.json' 
          : `https://api.jolpica.net/f1/current/${roundOffset}/results.json`;

        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("API Error");
        const data = await res.json();
        const race = data.MRData.RaceTable.Races[0];
        if (!race) return null;

        return {
          season: race.season,
          round: race.round,
          raceName: race.raceName,
          circuit: race.Circuit.circuitName,
          date: race.date,
          results: race.Results.map(r => ({
            pos: r.position,
            number: r.number,
            driver: `${r.Driver.givenName} ${r.Driver.familyName}`,
            code: r.Driver.code || '',
            team: r.Constructor.name,
            grid: r.grid,
            laps: r.laps,
            status: r.status,
            gap: r.Time ? r.Time.time : r.status,
            pts: r.points
          }))
        };
      } catch (e) {
        console.warn("F1 Race Results API Error:", e);
        return null;
      }
    }

    async function fetchF1DriverStandings() {
      try {
        const res = await fetch('https://api.jolpica.net/f1/current/driverStandings.json');
        if (!res.ok) throw new Error("API Error");
        const data = await res.json();
        const standingsList = data.MRData.StandingsTable.StandingsLists[0];
        if (!standingsList) return null;

        return standingsList.DriverStandings.map(s => ({
          pos: s.position,
          driver: `${s.Driver.givenName} ${s.Driver.familyName}`,
          code: s.Driver.code || '',
          team: s.Constructors[0] ? s.Constructors[0].name : '',
          wins: s.wins,
          pts: s.points
        }));
      } catch (e) {
        console.warn("F1 Standings API Error:", e);
        return null;
      }
    }

    // --- FOOTBALL-DATA.ORG API FETCHERS (USES SAFE USER KEY) ---
    async function fetchFootballMatches(compCode, matchday) {
      if (!apiKey) return null;

      try {
        const proxy = 'https://corsproxy.io/?';
        let targetUrl = `https://api.football-data.org/v4/competitions/${compCode}/matches`;
        if (matchday && matchday > 0) {
          targetUrl += `?matchday=${matchday}`;
        }
        
        const res = await fetch(proxy + encodeURIComponent(targetUrl), {
          headers: { 'X-Auth-Token': apiKey }
        });
        if (!res.ok) throw new Error("Football API Error");
        const data = await res.json();

        return {
          matchday: data.filters.matchday || matchday || 1,
          matches: data.matches.map(m => ({
            home: m.homeTeam.shortName || m.homeTeam.name,
            away: m.awayTeam.shortName || m.awayTeam.name,
            score: (m.status === 'FINISHED' || m.status === 'IN_PLAY' || m.status === 'PAUSED')
              ? `${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}`
              : 'vs',
            status: m.status === 'IN_PLAY' ? 'LIVE' : (m.status === 'FINISHED' ? 'FT' : 'UPCOMING'),
            time: m.status === 'IN_PLAY' ? "LIVE" : new Date(m.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            utcDate: m.utcDate
          }))
        };
      } catch (e) {
        console.warn("Football API fetch failed:", e);
        return null;
      }
    }

    async function fetchFootballStandings(compCode) {
      if (!apiKey) return null;

      try {
        const proxy = 'https://corsproxy.io/?';
        const targetUrl = `https://api.football-data.org/v4/competitions/${compCode}/standings`;
        
        const res = await fetch(proxy + encodeURIComponent(targetUrl), {
          headers: { 'X-Auth-Token': apiKey }
        });
        if (!res.ok) throw new Error("Standings API Error");
        const data = await res.json();
        const table = data.standings[0]?.table;
        if (!table) return null;

        return table.map(t => ({
          pos: t.position,
          team: t.team.shortName || t.team.name,
          p: t.playedGames,
          w: t.won,
          d: t.draw,
          l: t.lost,
          gf: t.goalsFor,
          ga: t.goalsAgainst,
          gd: t.goalDifference,
          pts: t.points
        }));
      } catch (e) {
        console.warn("Football Standings fetch failed:", e);
        return null;
      }
    }

    function switchView(view, evt) {
      currentView = view;
      currentRound = 0;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      render();
    }

    function changeRound(delta) {
      currentRound += delta;
      render();
    }

    async function render() {
      const container = document.getElementById('appContent');
      const label = document.getElementById('currentRoundLabel');
      const statusInd = document.getElementById('statusIndicator');

      container.innerHTML = `<div style="padding: 24px 0; font-weight: bold; color: #666666;">FETCHING LIVE DATA...</div>`;

      if (currentView === 'today') {
        label.textContent = "Today's Schedule";
        statusInd.textContent = "● Live Sync";
        
        const f1Data = await fetchF1RaceResults(0);
        
        container.innerHTML = `
          <div class="section-title">LATEST & TODAY'S EVENTS</div>
          ${f1Data ? `
            <div class="match-card" onclick="switchView('f1', null)" style="cursor: pointer;">
              <div>
                <span class="badge badge-f1" style="margin-right: 8px;">FORMULA 1</span>
                <span class="match-teams">${f1Data.raceName} (${f1Data.circuit})</span>
              </div>
              <div class="match-meta">
                <span class="badge badge-ft">Winner: ${f1Data.results[0]?.driver || 'TBD'}</span>
              </div>
            </div>
          ` : ''}

          <div class="match-card" onclick="switchView('epl', null)" style="cursor: pointer;">
            <div>
              <span class="badge badge-live" style="margin-right: 8px;">PREMIER LEAGUE</span>
              <span class="match-teams">Select Premier League tab to view live matchday fixtures</span>
            </div>
            <div class="match-meta">
              <span class="badge badge-upcoming">View Table & Scores</span>
            </div>
          </div>
        `;
      } else if (currentView === 'f1') {
        statusInd.textContent = "● Jolpica F1 Live API";
        
        const f1Race = await fetchF1RaceResults(currentRound === 0 ? 0 : currentRound);
        const f1Standings = await fetchF1DriverStandings();

        label.textContent = f1Race ? `Round ${f1Race.round}: ${f1Race.raceName}` : `Round ${currentRound || 'Latest'}`;

        container.innerHTML = `
          ${f1Race ? `
            <div class="section-title">${f1Race.raceName.toUpperCase()} — ${f1Race.circuit.toUpperCase()} (${f1Race.date})</div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>POS</th>
                  <th>DRIVER</th>
                  <th>TEAM</th>
                  <th class="text-center">GRID</th>
                  <th class="text-center">LAPS</th>
                  <th class="text-right">TIME / STATUS</th>
                  <th class="text-right">PTS</th>
                </tr>
              </thead>
              <tbody>
                ${f1Race.results.map(f => `
                  <tr>
                    <td class="highlight-pos">${f.pos}</td>
                    <td><strong>${f.driver}</strong> ${f.code ? `(${f.code})` : ''}</td>
                    <td>${f.team}</td>
                    <td class="text-center">${f.grid}</td>
                    <td class="text-center">${f.laps}</td>
                    <td class="text-right">${f.gap}</td>
                    <td class="text-right"><strong>${f.pts}</strong></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : `<p style="padding: 16px 0;">No race data found for this round.</p>`}

          ${f1Standings ? `
            <div class="section-title" style="margin-top: 32px;">DRIVERS CHAMPIONSHIP STANDINGS</div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>POS</th>
                  <th>DRIVER</th>
                  <th>CONSTRUCTOR</th>
                  <th class="text-center">WINS</th>
                  <th class="text-right">POINTS</th>
                </tr>
              </thead>
              <tbody>
                ${f1Standings.map(s => `
                  <tr>
                    <td class="highlight-pos">${s.pos}</td>
                    <td><strong>${s.driver}</strong></td>
                    <td>${s.team}</td>
                    <td class="text-center">${s.wins}</td>
                    <td class="text-right"><strong>${s.pts}</strong></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : ''}
        `;
      } else {
        // Football Leagues Routing: EPL, Champions League, FA Cup, Carabao Cup
        const compMap = {
          epl: 'PL',
          ucl: 'CL',
          facup: 'FAC',
          carabao: 'ELC'
        };
        const compCode = compMap[currentView] || 'PL';
        
        const liveMatches = await fetchFootballMatches(compCode, currentRound === 0 ? null : currentRound);
        const standings = compCode === 'PL' || compCode === 'CL' ? await fetchFootballStandings(compCode) : null;

        statusInd.textContent = apiKey ? (liveMatches ? "● Football-Data API Active" : "● Syncing...") : "● API Key Needed";
        label.textContent = liveMatches ? `Matchday ${liveMatches.matchday}` : `${currentView.toUpperCase()}`;

        container.innerHTML = `
          ${!apiKey ? `
            <div style="background: #fff8e1; border: 1px solid var(--border-dark); padding: 12px; margin-bottom: 16px; font-size: 12px;">
              <strong>Key Required:</strong> Paste your free API key from Football-Data.org in the top header box to enable live fixtures, scores, and standings for ${currentView.toUpperCase()}.
            </div>
          ` : ''}

          ${liveMatches ? `
            <div class="section-title">${currentView.toUpperCase()} FIXTURES (MATCHDAY ${liveMatches.matchday})</div>
            ${liveMatches.matches.map(m => `
              <div class="match-card">
                <div class="match-teams">${m.home} vs ${m.away}</div>
                <div class="match-meta">
                  <span class="match-score">${m.score}</span>
                  <span class="badge ${m.status === 'LIVE' ? 'badge-live' : (m.status === 'FT' ? 'badge-ft' : 'badge-upcoming')}">
                    ${m.status === 'LIVE' ? `● ${m.time}` : m.time}
                  </span>
                </div>
              </div>
            `).join('')}
          ` : ''}

          ${standings ? `
            <div class="section-title">${currentView.toUpperCase()} STANDINGS TABLE</div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>POS</th>
                  <th>CLUB</th>
                  <th class="text-center">P</th>
                  <th class="text-center">W</th>
                  <th class="text-center">D</th>
                  <th class="text-center">L</th>
                  <th class="text-center">GD</th>
                  <th class="text-right">PTS</th>
                </tr>
              </thead>
              <tbody>
                ${standings.map(s => `
                  <tr>
                    <td class="highlight-pos">${s.pos}</td>
                    <td><strong>${s.team}</strong></td>
                    <td class="text-center">${s.p}</td>
                    <td class="text-center">${s.w}</td>
                    <td class="text-center">${s.d}</td>
                    <td class="text-center">${s.l}</td>
                    <td class="text-center">${s.gd > 0 ? `+${s.gd}` : s.gd}</td>
                    <td class="text-right"><strong>${s.pts}</strong></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : ''}
        `;
      }
    }

    // Initial Load
    render();
  </script>
</body>
</html>
