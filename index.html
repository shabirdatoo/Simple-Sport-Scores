<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version" content="1.2.0">
  <title>Simple Sports Scores (v1.2.0)</title>
  <style>
    /* ==========================================================================
       SIMPLE SPORTS SCORES (v1.2.0) - BLACK & WHITE MONOSPACED STYLING
       Primary Accent Colors: 
       - Green (#00aa44): Live status, winners, FT
       - Blue  (#0066cc): Links, league tags, active tabs
       - Red   (#cc0000): F1 indicators, badges, highlights
       ========================================================================== */
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #dddddd;
      --border-dark: #222222;
      --accent-green: #00aa44;
      --accent-blue: #0066cc;
      --accent-red: #cc0000;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* --- HEADER & NAVIGATION --- */
    header {
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text);
      display: inline-block;
    }

    .brand-title span {
      color: var(--accent-blue);
    }

    .api-key-input {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 6px;
      border: 1px solid var(--border);
      width: 180px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-dark);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }

    .nav-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .nav-btn.active {
      background: var(--border-dark);
      color: #ffffff;
    }

    /* --- SUB NAVIGATION & CONTROLS --- */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .round-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
    }

    .round-btn {
      background: none;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      padding: 2px 8px;
      cursor: pointer;
    }

    .round-btn:hover {
      border-color: var(--border-dark);
      background: #f0f0f0;
    }

    /* --- STATUS BADGES --- */
    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 2px;
      display: inline-block;
      text-transform: uppercase;
    }

    .badge-live {
      background-color: var(--accent-green);
      color: #ffffff;
    }

    .badge-ft {
      border: 1px solid var(--border-dark);
      color: var(--text);
    }

    .badge-upcoming {
      border: 1px dashed var(--border);
      color: #666666;
    }

    .badge-f1 {
      background-color: var(--accent-red);
      color: #ffffff;
    }

    /* --- MATCH / EVENT CARDS --- */
    .section-title {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 4px;
      margin-top: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-card {
      border: 1px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s;
    }

    .match-card:hover {
      border-color: var(--border-dark);
    }

    .match-teams {
      font-weight: bold;
    }

    .match-meta {
      text-align: right;
      font-size: 13px;
    }

    .match-score {
      font-weight: bold;
      margin-right: 8px;
    }

    /* --- STANDINGS TABLES --- */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    .data-table th, .data-table td {
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    .data-table th {
      border-bottom: 2px solid var(--border-dark);
      font-weight: bold;
    }

    .data-table tr:hover td {
      background-color: #f8f8f8;
    }

    .text-center { text-align: center; }
    .text-right { text-align: right; }

    .highlight-pos {
      color: var(--accent-blue);
      font-weight: bold;
    }

    /* --- FOOTER --- */
    footer {
      border-top: 1px solid var(--border);
      margin-top: 32px;
      padding-top: 12px;
      font-size: 12px;
      color: #666666;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">SIMPLE SPORTS <span>SCORES</span></div>
      <div>
        <input type="text" id="apiKeyInput" class="api-key-input" placeholder="Football-Data.org Key (Optional)" onchange="saveApiKey(this.value)">
      </div>
    </div>
    <nav id="mainNav">
      <button class="nav-btn active" onclick="switchView('today', event)">Today</button>
      <button class="nav-btn" onclick="switchView('epl', event)">Premier League</button>
      <button class="nav-btn" onclick="switchView('f1', event)">Formula 1</button>
      <button class="nav-btn" onclick="switchView('facup', event)">FA Cup</button>
      <button class="nav-btn" onclick="switchView('carabao', event)">Carabao Cup</button>
      <button class="nav-btn" onclick="switchView('ucl', event)">Champions League</button>
    </nav>
  </header>

  <div class="controls-bar">
    <div class="round-nav">
      <button class="round-btn" onclick="changeRound(-1)">&lt; Prev</button>
      <span id="currentRoundLabel">Today's Matches</span>
      <button class="round-btn" onclick="changeRound(1)">Next &gt;</button>
    </div>
    <div style="font-size: 12px; color: #666666;">
      Status: <span id="statusIndicator" style="color: var(--accent-green); font-weight: bold;">● Live Sync</span>
    </div>
  </div>

  <main id="appContent">
    <!-- Dynamic Content Loaded Here -->
  </main>

  <footer>
    <div>Simple Sports Scores</div>
    <div>v1.2.0</div>
  </footer>

  <script>
    // --- VERSION & STATE MANAGEMENT ---
    const APP_VERSION = '1.2.0';
    let currentView = 'today';
    let currentRound = 1;
    let apiKey = localStorage.getItem('sss_football_key') || '';

    if (apiKey) {
      document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey(key) {
      apiKey = key.trim();
      localStorage.setItem('sss_football_key', apiKey);
      render();
    }

    // --- REAL API FETCHERS ---
    async function fetchF1Data(round) {
      try {
        const roundParam = round || 'current';
        const res = await fetch(`https://api.jolpica.net/f1/2026/${roundParam}/results.json`);
        if (!res.ok) throw new Error("API Error");
        const data = await res.json();
        const race = data.MRData.RaceTable.Races[0];
        if (!race) return null;

        return {
          title: race.raceName,
          circuit: race.Circuit.circuitName,
          round: race.round,
          results: race.Results.map(r => ({
            pos: r.position,
            driver: `${r.Driver.givenName} ${r.Driver.familyName}`,
            team: r.Constructor.name,
            gap: r.Time ? r.Time.time : r.status,
            pts: r.points
          }))
        };
      } catch (e) {
        console.warn("F1 live API offline or rate-limited. Using backup.", e);
        return null;
      }
    }

    async function fetchFootballData(competitionCode, matchday) {
      try {
        const proxy = 'https://corsproxy.io/?';
        const targetUrl = `https://api.football-data.org/v4/competitions/${competitionCode}/matches?matchday=${matchday}`;
        const headers = apiKey ? { 'X-Auth-Token': apiKey } : {};

        const res = await fetch(proxy + encodeURIComponent(targetUrl), { headers });
        if (!res.ok) throw new Error("API Error");
        const data = await res.json();

        return data.matches.map(m => ({
          home: m.homeTeam.shortName || m.homeTeam.name,
          away: m.awayTeam.shortName || m.awayTeam.name,
          score: (m.status === 'FINISHED' || m.status === 'IN_PLAY' || m.status === 'PAUSED')
            ? `${m.score.fullTime.home ?? 0} - ${m.score.fullTime.away ?? 0}`
            : 'vs',
          status: m.status === 'IN_PLAY' ? 'LIVE' : (m.status === 'FINISHED' ? 'FT' : 'UPCOMING'),
          time: m.status === 'IN_PLAY' ? "LIVE" : new Date(m.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }));
      } catch (e) {
        console.warn("Football API offline/no key. Using backup.", e);
        return null;
      }
    }

    // --- FALLBACK LOCAL DATASET ---
    const BACKUP_DATA = {
      today: [
        { league: 'Premier League', leagueKey: 'epl', home: 'Arsenal', away: 'Chelsea', score: '2 - 1', status: 'LIVE', time: "74'" },
        { league: 'Premier League', leagueKey: 'epl', home: 'Liverpool', away: 'Man City', score: 'vs', status: 'UPCOMING', time: '16:30' },
        { league: 'Formula 1', leagueKey: 'f1', title: 'British Grand Prix - Race', circuit: 'Silverstone', status: 'LIVE', time: 'Lap 32/52' },
        { league: 'Champions League', leagueKey: 'ucl', home: 'Real Madrid', away: 'Bayern Munich', score: '3 - 2', status: 'FT', time: 'FT' }
      ],
      epl: [
        { home: 'Arsenal', away: 'Chelsea', score: '2 - 1', status: 'LIVE', time: "74'" },
        { home: 'Aston Villa', away: 'Everton', score: '1 - 0', status: 'FT', time: 'FT' },
        { home: 'Liverpool', away: 'Man City', score: 'vs', status: 'UPCOMING', time: '16:30' },
        { home: 'Tottenham', away: 'West Ham', score: 'vs', status: 'UPCOMING', time: '19:00' }
      ],
      eplStandings: [
        { pos: 1, team: 'Arsenal', p: 28, w: 20, d: 5, l: 3, pts: 65 },
        { pos: 2, team: 'Man City', p: 28, w: 19, d: 6, l: 3, pts: 63 },
        { pos: 3, team: 'Liverpool', p: 28, w: 18, d: 6, l: 4, pts: 60 },
        { pos: 4, team: 'Aston Villa', p: 28, w: 16, d: 4, l: 8, pts: 52 }
      ],
      f1: [
        { pos: 1, driver: 'M. Verstappen', team: 'Red Bull Racing', gap: 'LEADER', pts: 25 },
        { pos: 2, driver: 'L. Norris', team: 'McLaren', gap: '+2.412s', pts: 18 },
        { pos: 3, driver: 'C. Leclerc', team: 'Ferrari', gap: '+8.901s', pts: 15 },
        { pos: 4, driver: 'L. Hamilton', team: 'Ferrari', gap: '+14.220s', pts: 12 }
      ]
    };

    function switchView(view, evt) {
      currentView = view;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      render();
    }

    function changeRound(delta) {
      currentRound += delta;
      if (currentRound < 1) currentRound = 1;
      render();
    }

    async function render() {
      const container = document.getElementById('appContent');
      const label = document.getElementById('currentRoundLabel');
      const statusInd = document.getElementById('statusIndicator');

      container.innerHTML = `<div style="padding: 24px 0; font-weight: bold; color: #666666;">FETCHING LIVE DATA...</div>`;

      if (currentView === 'today') {
        label.textContent = "Today's Matches";
        statusInd.textContent = "● Live Sync";
        
        container.innerHTML = `
          <div class="section-title">TODAY'S SCHEDULE</div>
          ${BACKUP_DATA.today.map(item => `
            <div class="match-card" onclick="switchView('${item.leagueKey}', null)" style="cursor: pointer;">
              <div>
                <span class="badge badge-f1" style="margin-right: 8px;">${item.league}</span>
                <span class="match-teams">${item.home ? `${item.home} vs ${item.away}` : item.title}</span>
              </div>
              <div class="match-meta">
                ${item.score ? `<span class="match-score">${item.score}</span>` : ''}
                <span class="badge ${item.status === 'LIVE' ? 'badge-live' : (item.status === 'FT' ? 'badge-ft' : 'badge-upcoming')}">
                  ${item.status === 'LIVE' ? `● ${item.time}` : item.time}
                </span>
              </div>
            </div>
          `).join('')}
        `;
      } else if (currentView === 'epl') {
        label.textContent = `Matchday ${currentRound}`;
        const liveMatches = await fetchFootballData('PL', currentRound);
        const matchesToDisplay = liveMatches || BACKUP_DATA.epl;

        statusInd.textContent = liveMatches ? "● Live API" : "● Cached Data";

        container.innerHTML = `
          <div class="section-title">MATCHDAY ${currentRound} FIXTURES</div>
          ${matchesToDisplay.map(m => `
            <div class="match-card">
              <div class="match-teams">${m.home} vs ${m.away}</div>
              <div class="match-meta">
                <span class="match-score">${m.score}</span>
                <span class="badge ${m.status === 'LIVE' ? 'badge-live' : (m.status === 'FT' ? 'badge-ft' : 'badge-upcoming')}">
                  ${m.status === 'LIVE' ? `● ${m.time}` : m.time}
                </span>
              </div>
            </div>
          `).join('')}

          <div class="section-title">LEAGUE TABLE</div>
          <table class="data-table">
            <thead>
              <tr>
                <th>POS</th>
                <th>CLUB</th>
                <th class="text-center">P</th>
                <th class="text-center">W</th>
                <th class="text-center">D</th>
                <th class="text-center">L</th>
                <th class="text-right">PTS</th>
              </tr>
            </thead>
            <tbody>
              ${BACKUP_DATA.eplStandings.map(s => `
                <tr>
                  <td class="highlight-pos">${s.pos}</td>
                  <td><strong>${s.team}</strong></td>
                  <td class="text-center">${s.p}</td>
                  <td class="text-center">${s.w}</td>
                  <td class="text-center">${s.d}</td>
                  <td class="text-center">${s.l}</td>
                  <td class="text-right"><strong>${s.pts}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else if (currentView === 'f1') {
        label.textContent = `Round ${currentRound}`;
        const f1Data = await fetchF1Data(currentRound);

        statusInd.textContent = f1Data ? "● Live API" : "● Cached Data";

        const raceTitle = f1Data ? `${f1Data.title} (${f1Data.circuit})` : "British Grand Prix (Silverstone)";
        const results = f1Data ? f1Data.results : BACKUP_DATA.f1;

        container.innerHTML = `
          <div class="section-title">${raceTitle.toUpperCase()}</div>
          <table class="data-table">
            <thead>
              <tr>
                <th>POS</th>
                <th>DRIVER</th>
                <th>TEAM</th>
                <th class="text-right">GAP / TIME</th>
                <th class="text-right">PTS</th>
              </tr>
            </thead>
            <tbody>
              ${results.map(f => `
                <tr>
                  <td class="highlight-pos">${f.pos}</td>
                  <td><strong>${f.driver}</strong></td>
                  <td>${f.team}</td>
                  <td class="text-right">${f.gap}</td>
                  <td class="text-right"><strong>${f.pts}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else {
        label.textContent = `Round ${currentRound}`;
        statusInd.textContent = "● Live Sync";
        container.innerHTML = `
          <div class="section-title">${currentView.toUpperCase()} FIXTURES</div>
          <p style="padding: 16px 0; color: #666666;">No scheduled matches found for this round.</p>
        `;
      }
    }

    // Initial Load
    render();
  </script>
</body>
</html>
